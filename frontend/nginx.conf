# Servidor de archivos estáticos del panel (dentro del contenedor "frontend").
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Archivos con hash en el nombre: se pueden cachear para siempre.
    location ~* \.(js|css|woff2|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Rutas de React: devolver siempre index.html (sin caché).
    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
