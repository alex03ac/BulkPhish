# Carga automáticamente los dashboards guardados en /var/lib/grafana/dashboards.
apiVersion: 1
providers:
  - name: BulkPhish
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
