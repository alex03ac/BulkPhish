# API Gateway de BulkPhish: única puerta de entrada (puerto 8080).
# Decide qué rutas son públicas, exige JWT en las protegidas, limita el ritmo de
# peticiones, agrega cabeceras de seguridad y evita escribir secretos en los registros.
# Corre como usuario sin privilegios (imagen nginx-unprivileged) y con sistema de archivos de solo lectura.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;                       # no revelar la versión de NGINX

    # Directorios temporales en /tmp (el resto del sistema de archivos es de solo lectura).
    client_body_temp_path /tmp/cuerpo;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Los tokens de los enlaces del correo son secretos: nunca se escriben en los registros.
    map $uri $ruta_log {
        ~^/t/                              "/t/***";
        ~^/r/                              "/r/***";
        ~^/capacitacion/                   "/capacitacion/***";
        ~^/reportado/                      "/reportado/***";
        ~^/api/publico/capacitacion/       "/api/publico/capacitacion/***";
        default                            $uri;
    }
    # El registro no incluye cabeceras (Authorization) ni cadenas de consulta.
    log_format json escape=json '{"hora":"$time_iso8601","id":"$request_id","metodo":"$request_method","ruta":"$ruta_log",'
                                '"estado":$status,"ms":$request_time,"usuario":"$upstream_http_x_usuario"}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    # ---- Límites de ritmo (por IP de origen) ----
    limit_req_zone $binary_remote_addr zone=login:10m   rate=10r/m;   # contra fuerza bruta
    limit_req_zone $binary_remote_addr zone=publico:10m rate=60r/m;   # enlaces de correo
    limit_req_zone $binary_remote_addr zone=api:10m     rate=900r/m;  # panel (consulta cada 3 s)
    limit_req_status 429;

    upstream frontend      { server frontend:8080; }
    upstream autenticacion { server autenticacion:8081; }
    upstream campanas      { server campanas:8082; }
    upstream resultados    { server resultados:8083; }

    server {
        listen 8080;

        # ---- Cabeceras de seguridad (se envían en todas las respuestas) ----
        # IMPORTANTE: no agregar add_header dentro de un "location": NGINX descartaría estas.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;          # el token del enlace no viaja a otros sitios
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Request-Id $request_id always;
        # Con HTTPS delante (producción), agregar también:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # no se confía en lo que envíe el cliente
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        proxy_hide_header X-Powered-By;
        client_max_body_size 1m;
        client_body_timeout 10s;
        client_header_timeout 10s;
        keepalive_timeout 30s;

        # Estado del propio gateway (para el healthcheck).
        location = /estado { access_log off; default_type text/plain; return 200 'ok'; }

        # Archivos ocultos (.env, .git, ...) jamás se sirven.
        location ~ /\. { return 404; }

        # ---- Subpetición interna: ¿el JWT es válido? ----
        location = /_validar {
            internal;
            proxy_pass http://autenticacion/validar;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        # ---- Rutas PÚBLICAS (sin JWT) ----
        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://autenticacion;
        }
        location /api/auth/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://autenticacion;
        }
        location ~ ^/(t|r)/[A-Za-z0-9]+$ {
            limit_req zone=publico burst=20 nodelay;
            proxy_pass http://campanas;
        }
        location /api/publico/ {
            limit_req zone=publico burst=20 nodelay;
            proxy_pass http://campanas;
        }

        # ---- Rutas PROTEGIDAS (exigen JWT) ----
        location ~ ^/api/(campanas|empleados|plantillas|areas)(/|$) {
            limit_req zone=api burst=100 nodelay;
            auth_request /_validar;
            auth_request_set $usuario $upstream_http_x_usuario;
            proxy_set_header X-Usuario $usuario;   # sobrescribe cualquier valor enviado por el cliente
            proxy_pass http://campanas;
        }
        location /api/resultados/ {
            limit_req zone=api burst=100 nodelay;
            auth_request /_validar;
            auth_request_set $usuario $upstream_http_x_usuario;
            proxy_set_header X-Usuario $usuario;
            proxy_pass http://resultados;
        }

        # Cualquier otra ruta de /api no existe.
        location /api/ {
            default_type application/json;
            return 404 '{"error":"Ruta no encontrada."}';
        }

        # ---- Todo lo demás: la aplicación web (React) ----
        location / {
            proxy_pass http://frontend;
        }
    }
}
